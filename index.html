<!DOCTYPE html>
<!-- 每天学5个字 · 汉字启蒙工作台 | 单文件 · 零外链 · 本地存储 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FAF7F2">
<title>每天学5个字 · 汉字启蒙台</title>
<style>
:root{
  --ink:#2B2620; --ink2:#4A4238; --muted:#8A8073;
  --paper:#FAF7F2; --card:#FFFFFF; --line:#EBE3D6;
  --red:#B5442E; --red-soft:#F7E6E1;
  --green:#2E6B5E; --green-soft:#E3EFEB;
  --gold:#C0913B; --gold-soft:#FBF1DC;
  --blue:#3C6489; --blue-soft:#E6EEF6;
  --shadow:0 2px 12px rgba(43,38,32,.06);
  --shadow-lg:0 8px 28px rgba(43,38,32,.10);
  --r:16px;
  --font:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); background:var(--paper); color:var(--ink);
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:16px}
h1,h2,h3,h4{margin:0;font-weight:600}
svg{display:block}

/* ============ 布局 ============ */
.app{display:flex;min-height:100vh}
.sidebar{
  width:228px;flex:0 0 228px;background:var(--card);border-right:1px solid var(--line);
  padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand-mark{
  width:38px;height:38px;border-radius:11px;background:var(--red);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;flex:0 0 auto;
  box-shadow:0 3px 10px rgba(181,68,46,.28);
}
.brand-txt b{display:block;font-size:15px;letter-spacing:.5px}
.brand-txt span{font-size:11.5px;color:var(--muted)}
.nav-btn{
  display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border-radius:11px;
  font-size:14.5px;color:var(--ink2);text-align:left;transition:.15s;min-height:44px;
}
.nav-btn svg{width:19px;height:19px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-btn:hover{background:#F5F0E8}
.nav-btn.on{background:var(--red-soft);color:var(--red);font-weight:600}
.nav-badge{
  margin-left:auto;background:var(--red);color:#fff;font-size:11px;line-height:1;
  padding:3px 6px;border-radius:20px;font-weight:600;
}
.nav-btn.on .nav-badge{background:var(--red)}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.7}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:5px;vertical-align:1px}

.main{flex:1;min-width:0;padding:26px 30px 60px;max-width:1120px}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.topbar h1{font-size:21px;letter-spacing:.3px}
.topbar .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 15px;border-radius:10px;font-size:13.5px;font-weight:500;
  border:1px solid var(--line);background:var(--card);color:var(--ink2);transition:.15s;min-height:44px;
}
.btn:hover{border-color:#D8CDB9;background:#FCFAF6}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn-primary{background:var(--red);border-color:var(--red);color:#fff}
.btn-primary:hover{background:#A03A26;border-color:#A03A26}
.btn-green{background:var(--green);border-color:var(--green);color:#fff}
.btn-green:hover{background:#255A4E;border-color:#255A4E}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{background:#F2ECE2;color:var(--ink2)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ============ 今天要处理 ============ */
.today-box{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 20px;margin-bottom:20px;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.today-box::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red)}
.today-head{display:flex;align-items:center;gap:9px;margin-bottom:13px;flex-wrap:wrap}
.today-head h2{font-size:15px;letter-spacing:.4px}
.today-head .date{margin-left:auto;font-size:12px;color:var(--muted)}
.today-list{display:grid;gap:9px}
.td-row{
  display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;
  background:#FCFAF6;border:1px solid #F0E9DC;
}
.td-row.alert{background:var(--red-soft);border-color:#F0D3C9}
.td-ico{
  width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;background:var(--green-soft);color:var(--green);
}
.td-row.alert .td-ico{background:#F2D4CB;color:var(--red)}
.td-ico svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.td-txt{flex:1;min-width:0}
.td-txt b{font-size:13.5px;font-weight:600;display:block}
.td-txt span{font-size:12px;color:var(--muted)}
.td-row.alert .td-txt span{color:#9C4A38}
.td-act{padding:7px 13px;border-radius:9px;font-size:12.5px;font-weight:600;background:var(--green);color:#fff;flex:0 0 auto;min-height:38px}
.td-row.alert .td-act{background:var(--red)}
.td-act:hover{filter:brightness(1.08)}

/* ============ 通用卡片 ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-pad{padding:20px}
.sec-title{font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.sec-title svg{width:17px;height:17px;stroke:var(--red);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hint{font-size:12.5px;color:var(--muted);line-height:1.7}
.view{display:none}
.view.on{display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

/* 进度条 */
.bar{height:7px;border-radius:20px;background:#EFE8DB;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:20px;background:var(--green);transition:width .4s}

/* ============ 象形字卡 ============ */
.card-deck{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}
@media (max-width:1180px){.card-deck{grid-template-columns:repeat(3,1fr)}}
.zi-card{
  position:relative;border-radius:18px;cursor:pointer;perspective:900px;
  aspect-ratio:3/4;min-height:190px;
}
.zi-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.zi-card.flip .zi-inner{transform:rotateY(180deg)}
.zi-face{
  position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
  padding:12px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
}
.zi-front{background:linear-gradient(170deg,#FFFDF9,#FBF6EC)}
.zi-front .picto{width:58px;height:58px;margin-bottom:6px;opacity:.8}
.zi-front .picto svg{width:100%;height:100%;stroke:var(--ink2);fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.zi-char{font-size:44px;font-weight:600;line-height:1.1;letter-spacing:2px;font-family:"Kaiti SC","STKaiti","KaiTi",var(--font)}
.zi-py{font-size:12.5px;color:var(--muted);margin-top:4px;letter-spacing:.5px}
.zi-flip-hint{
  position:absolute;bottom:8px;font-size:10.5px;color:#B8AE9C;display:flex;align-items:center;gap:3px;
}
.zi-back{
  transform:rotateY(180deg);background:var(--card);justify-content:flex-start;padding:13px 12px;
  overflow-y:auto;align-items:stretch;text-align:left;
}
.zi-back .bchar{font-size:26px;font-weight:600;font-family:"Kaiti SC","STKaiti","KaiTi",var(--font);line-height:1.2}
.zi-back .bmeta{font-size:10.5px;color:var(--muted);margin-bottom:7px;letter-spacing:.3px}
.zi-back .bsec{font-size:11.5px;color:var(--ink2);line-height:1.6;margin-bottom:5px}
.zi-back .bsec b{color:var(--red);font-weight:600;font-size:11px;letter-spacing:.5px;display:block;margin-bottom:1px}
.zi-back .word-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.wchip{font-size:11px;padding:2px 7px;border-radius:20px;background:var(--green-soft);color:var(--green);font-weight:500}
.zi-learned{position:absolute;top:9px;right:9px;width:20px;height:20px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;z-index:3}
.zi-learned svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

/* ============ 练习 ============ */
.qwrap{max-width:680px;margin:0 auto}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.qstep{font-size:12.5px;color:var(--muted)}
.qtype{font-size:11.5px;padding:3px 9px;border-radius:20px;background:var(--blue-soft);color:var(--blue);font-weight:600}
.qstem{font-size:17px;line-height:1.9;margin-bottom:18px;letter-spacing:.3px}
.qstem .blank{display:inline-block;min-width:34px;border-bottom:2px solid var(--red);margin:0 4px;text-align:center;color:var(--red);font-weight:600}
.qstem .bigzi{font-size:30px;font-weight:600;color:var(--red);font-family:"Kaiti SC","STKaiti","KaiTi",var(--font);vertical-align:-3px;margin:0 3px}
.opts{display:grid;gap:10px}
.opt{
  display:flex;align-items:center;gap:11px;padding:14px 16px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--card);font-size:16px;text-align:left;transition:.15s;min-height:52px;
}
.opt:hover:not(.locked){border-color:#D6C9B4;background:#FCFAF6}
.opt .k{
  width:23px;height:23px;border-radius:7px;background:#F3EEE4;color:var(--muted);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:0 0 auto;
}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.right .k{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .k{background:var(--red);color:#fff}
.opt.locked{cursor:default}
.opt-mark{margin-left:auto;font-size:12px;font-weight:600}
.qfeedback{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:13.5px;line-height:1.75;display:none}
.qfeedback.show{display:block}
.qfeedback.ok{background:var(--green-soft);color:#235347}
.qfeedback.no{background:var(--red-soft);color:#8C3B29}
.qfeedback b{font-weight:600}
.qfoot{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.qfoot .btn{flex:1;min-width:120px}
.empty{text-align:center;padding:44px 20px;color:var(--muted);font-size:13.5px}
.empty svg{width:44px;height:44px;margin:0 auto 12px;stroke:#CFC5B3;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}

/* ============ 闯关 ============ */
.lv-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{padding:15px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.stat .lb{font-size:11.5px;color:var(--muted);letter-spacing:.4px}
.stat .vl{font-size:23px;font-weight:600;margin-top:3px;letter-spacing:.5px}
.stat .vl small{font-size:12px;font-weight:500;color:var(--muted);margin-left:2px}
.lv-map{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:20px}
.lv-cell{
  padding:15px 16px;border-radius:15px;background:var(--card);border:1px solid var(--line);
  box-shadow:var(--shadow);position:relative;overflow:hidden;text-align:left;
}
.lv-cell.done{border-color:#BFDCD3;background:linear-gradient(160deg,#F5FBF9,#FFFFFF)}
.lv-cell.lock{opacity:.62}
.lv-cell .lvno{font-size:11px;color:var(--muted);letter-spacing:1px;font-weight:600}
.lv-cell .lvname{font-size:15px;font-weight:600;margin:3px 0 8px}
.lv-cell .lvmeta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.lv-cell .bar{margin-top:9px;height:5px}
.lv-tag{
  position:absolute;top:12px;right:12px;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;
  background:var(--green-soft);color:var(--green);
}
.lv-tag.l{background:#F2ECE2;color:var(--muted)}
.reward-item{
  display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:12px;
  background:#FCFAF6;border:1px solid #F0E9DC;margin-bottom:9px;
}
.reward-item .rw-ico{width:34px;height:34px;border-radius:10px;background:var(--gold-soft);color:var(--gold);display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:16px}
.reward-item .rw-txt{flex:1;min-width:0}
.reward-item .rw-txt b{font-size:13.5px;display:block}
.reward-item .rw-txt span{font-size:11.5px;color:var(--muted)}
.reward-item .rw-cost{font-size:12.5px;font-weight:600;color:var(--gold);white-space:nowrap}

/* ============ 错题/知识 ============ */
.search-row{display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap}
.search-box{flex:1;min-width:200px;position:relative}
.search-box svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.search-box input{
  width:100%;padding:12px 14px 12px 38px;border-radius:11px;border:1px solid var(--line);
  background:var(--card);outline:none;transition:.15s;min-height:46px;color:var(--ink);
}
.search-box input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(181,68,46,.08)}
.seg{display:flex;background:#F2ECE2;padding:3px;border-radius:11px;gap:2px}
.seg button{padding:8px 14px;border-radius:9px;font-size:13px;color:var(--muted);min-height:40px}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.wrong-item{
  display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:13px;
  background:var(--card);border:1px solid var(--line);margin-bottom:9px;box-shadow:var(--shadow);
}
.wrong-zi{
  width:46px;height:46px;border-radius:12px;background:var(--red-soft);color:var(--red);
  display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:600;flex:0 0 auto;
  font-family:"Kaiti SC","STKaiti","KaiTi",var(--font);
}
.wrong-info{flex:1;min-width:0}
.wrong-info b{font-size:14px;display:block}
.wrong-info span{font-size:11.5px;color:var(--muted)}
.mini-btn{padding:7px 12px;border-radius:9px;font-size:12.5px;font-weight:600;background:var(--green-soft);color:var(--green);min-height:38px;flex:0 0 auto}
.mini-btn:hover{background:#D3E8E1}
/* 错题专项重练：入口条 + 练习页模式提示 */
.wrong-tools{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 15px;border-radius:13px;
  background:var(--gold-soft);border:1px solid #EFDFC0;margin-bottom:12px;
}
.wrong-tools .wt-txt{flex:1;min-width:150px;font-size:13px;color:var(--ink2)}
.wrong-tools .wt-txt b{color:var(--red)}
.wrong-tools .btn{background:var(--card);border:1px solid #E6D3AC;color:var(--ink);font-size:13px;min-height:40px;padding:8px 14px}
.wrong-tools .btn:hover{background:#FFFDF9}
.quiz-mode{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;
  padding:10px 14px;border-radius:12px;background:var(--gold-soft);border:1px solid #EFDFC0;
  font-size:12.5px;color:var(--ink2);
}
.quiz-mode .qm-tag{
  font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;
  background:var(--gold);color:#fff;flex:0 0 auto;
}
.quiz-mode .qm-txt{flex:1;min-width:120px}
.quiz-mode .qm-exit{
  font-size:12.5px;font-weight:600;color:var(--blue);padding:6px 10px;border-radius:9px;
  background:var(--card);border:1px solid var(--line);min-height:36px;
}
.quiz-mode .qm-exit:hover{background:#FFFDF9}
.kb-item{
  padding:14px 16px;border-radius:13px;background:var(--card);border:1px solid var(--line);
  margin-bottom:9px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;
}
.kb-item:hover{border-color:#D8CDB9;transform:translateY(-1px)}
.kb-top{display:flex;align-items:center;gap:11px}
.kb-zi{width:40px;height:40px;border-radius:10px;background:#F5F0E8;color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;flex:0 0 auto;font-family:"Kaiti SC","STKaiti","KaiTi",var(--font)}
.kb-meta{flex:1;min-width:0}
.kb-meta b{font-size:14px;display:block}
.kb-meta span{font-size:11.5px;color:var(--muted)}
.kb-arrow{color:#C9BFAE;flex:0 0 auto}
.kb-arrow svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ============ 弹层 ============ */
.mask{
  position:fixed;inset:0;background:rgba(43,38,32,.42);display:none;align-items:center;justify-content:center;
  padding:18px;z-index:80;backdrop-filter:blur(2px);
}
.mask.show{display:flex}
.modal{
  background:var(--card);border-radius:20px;width:100%;max-width:460px;max-height:86vh;overflow-y:auto;
  padding:24px;box-shadow:var(--shadow-lg);animation:pop .22s ease;
}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal h3{font-size:17px;margin-bottom:6px}
.modal .m-sub{font-size:12.5px;color:var(--muted);margin-bottom:16px}
.modal .m-foot{display:flex;gap:10px;margin-top:20px}
.modal .m-foot .btn{flex:1}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.field input{
  width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);
  outline:none;background:#FCFAF6;min-height:46px;color:var(--ink);
}
.field input:focus{border-color:var(--red);background:#fff}
.kb-detail .d-zi{font-size:54px;font-weight:600;text-align:center;font-family:"Kaiti SC","STKaiti","KaiTi",var(--font);line-height:1.1}
.kb-detail .d-py{text-align:center;color:var(--muted);font-size:13px;margin-bottom:16px}
.kb-detail .d-block{margin-bottom:13px}
.kb-detail .d-block b{font-size:11.5px;color:var(--red);letter-spacing:.6px;display:block;margin-bottom:3px}
.kb-detail .d-block p{margin:0;font-size:13.5px;line-height:1.8;color:var(--ink2)}
.kb-detail .d-picto{width:74px;height:74px;margin:0 auto 8px}
.kb-detail .d-picto svg{width:100%;height:100%;stroke:var(--ink2);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

/* toast */
.toast{
  position:fixed;left:50%;bottom:88px;transform:translate(-50%,16px);z-index:120;
  background:rgba(43,38,32,.92);color:#fff;padding:11px 20px;border-radius:24px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:.28s;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 底部 tabbar（移动） */
.tabbar{display:none}

/* ============ 响应式 ============ */
@media (max-width:900px){
  .grid2{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr}
  .lv-stats{grid-template-columns:1fr 1fr}
  .lv-map{grid-template-columns:1fr 1fr}
}
@media (max-width:768px){
  .sidebar{display:none}
  .main{padding:16px 14px calc(78px + env(safe-area-inset-bottom));max-width:none}

var ZI = {};       // 字 -> 详情对象
var ALLCHARS = []; // 全部字（按关卡顺序）
var WORDSET = {};  // 全部词语，用于校验干扰项
(function buildIndex(){
  for(var i=0;i<RAW.length;i++){
    var a = RAW[i];
    var o = { c:a[0], p:a[1], r:a[2], s:a[3], st:a[4], m:a[5], pic:a[6], w:a[7], e:a[8], lv:1, no:i+1 };
    ZI[o.c] = o;
    ALLCHARS.push(o.c);
    for(var j=0;j<o.w.length;j++){ WORDSET[o.w[j]] = 1; }
  }
  for(var k=0;k<LEVELS.length;k++){
    var lv = LEVELS[k];
    for(var t=0;t<lv.chars.length;t++){
      if(ZI[lv.chars[t]]){ ZI[lv.chars[t]].lv = lv.no; }
    }
  }
})();

  var demoChars = ['日','月','山','水'];
  s.learnLog[y] = demoChars.slice();
  for(var i=0;i<demoChars.length;i++){
    s.learned[demoChars[i]] = { at:y, ts:ts + i*1000, lv:1 };
  }
  s.wrong['水'] = { count:2, ts:ts + 5000, type:'组词' };
  s.charStat['水'] = { right:1, wrong:2 };
  s.points = 40;
  s.demo = true;
  return s;
}

function loadState(){
  var s = null;
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(raw){ s = JSON.parse(raw); }
  }catch(e){ s = null; }
  if(!s || s.v !== 1 || !s.learned){
    s = defaultState();
    seedDemo(s);
    try{ localStorage.setItem(LS_KEY, JSON.stringify(s)); }catch(e){}
    return s;
  }
  // 向后兼容补字段
  if(!s.learnLog) s.learnLog = {};
  if(!s.wrong) s.wrong = {};
  if(!s.charStat) s.charStat = {};
  if(!s.levelPass) s.levelPass = {};
  if(!s.rewards || !s.rewards.length) s.rewards = defaultState().rewards;
  if(typeof s.points !== 'number') s.points = 0;
  if(typeof s.spent !== 'number') s.spent = 0;
  return s;
}

function saveState(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch(e){ toast('保存失败：本地存储空间可能已满'); }
}

/* ============================================================
   二、工具与计算层（纯函数，不改 DOM）
   ============================================================ */
function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function fmtDate(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function todayStr(){ return fmtDate(new Date()); }
function offsetDate(n){ var d = new Date(); d.setDate(d.getDate() + n); return fmtDate(d); }
function parseDate(s){ var a = String(s).split('-'); return new Date(+a[0], +a[1]-1, +a[2]); }
function dayDiff(a,b){ return Math.round((parseDate(b) - parseDate(a)) / 86400000); }
function cnDate(s){ var a = String(s).split('-'); return a[1] + '月' + a[2] + '日'; }
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function pickRand(arr, n, exclude){
  var pool = arr.filter(function(x){ return exclude.indexOf(x) < 0; });
  return shuffle(pool).slice(0, n);
}
function learnedCount(){ return Object.keys(state.learned).length; }
function isLearned(ch){ return !!state.learned[ch]; }
function markLearned(ch){
  if(state.learned[ch]) return false;
  var d = todayStr();
  state.learned[ch] = { at:d, ts:Date.now(), lv:(ZI[ch] ? ZI[ch].lv : 1) };
  if(!state.learnLog[d]) state.learnLog[d] = [];
  if(state.learnLog[d].indexOf(ch) < 0) state.learnLog[d].push(ch);
  return true;
}

// 今日学习计划：优先未学的字（按字库顺序），不足则复习错题
function ensureTodayPlan(){
  var d = todayStr();
  if(!state.learnLog[d]){ state.learnLog[d] = []; }
  var plan = state.learnLog[d];
  // 补齐到 5 个（若今天还没学够）
  var need = 5 - plan.length;
  if(need > 0){
    var unlearned = ALLCHARS.filter(function(c){ return !state.learned[c] && plan.indexOf(c) < 0; });
    for(var i=0;i<need && i<unlearned.length;i++){ plan.push(unlearned[i]); }
  }
  if(plan.length === 0){
    // 全部学完：今日改为复习错题最多的 5 个
    var ws = Object.keys(state.wrong).sort(function(a,b){ return state.wrong[b].count - state.wrong[a].count; });
    plan = ws.slice(0,5);
    if(!plan.length){ plan = ALLCHARS.slice(0,5); }
    state.learnLog[d] = plan;
  }
  return plan;
}

// 今日已掌握数量
function todayDoneCount(plan){
  var n = 0;
  for(var i=0;i<plan.length;i++){ if(isLearned(plan[i])) n++; }
  return n;
}

// 连续学习天数（含今天，今天没学则从昨天往前数）
function streakDays(){
  var d = todayStr(), n = 0, cur = d;
  if(!(state.learnLog[cur] && state.learnLog[cur].length)){ cur = offsetDate(-1); }
  while(true){
    var log = state.learnLog[cur];
    if(log && log.length){ n++; cur = (function(s){ var t = parseDate(s); t.setDate(t.getDate()-1); return fmtDate(t); })(cur); }
    else break;
    if(n > 400) break;
  }
  return n;
}

// 关卡进度
function levelStat(lvNo){
  var lv = LEVELS[lvNo-1], done = 0, right = 0, wrong = 0;
  for(var i=0;i<lv.chars.length;i++){
    var c = lv.chars[i];
    if(isLearned(c)) done++;
    var st = state.charStat[c];
    if(st){ right += st.right || 0; wrong += st.wrong || 0; }
  }
  var total = lv.chars.length;
  var rate = (right + wrong) > 0 ? Math.round(right / (right + wrong) * 100) : 0;
  return {
    done: done, total: total, rate: rate, tested: right + wrong,
    learnFull: done >= total, passed: !!state.levelPass[lvNo],
    unlocked: lvNo === 1 || !!state.levelPass[lvNo-1] || done > 0
  };
}

function wrongArr(){
  var out = [];
  for(var c in state.wrong){
    if(!state.wrong.hasOwnProperty(c)) continue;
    var w = state.wrong[c];
    out.push({ c:c, count:w.count || 1, ts:w.ts || 0, type:w.type || '组词' });
  }
  out.sort(function(a,b){ return b.ts - a.ts; });
  return out;
}

function monthSpend(){
  var now = new Date(), m = now.getMonth(), y = now.getFullYear(), sum = 0;
  for(var i=0;i<(state.rewards||[]).length;i++){
    var r = state.rewards[i];
    if(r.claimed){
      var d = new Date(r.claimed);
      if(d.getFullYear() === y && d.getMonth() === m) sum += r.cost;
    }
  }
  return sum;
}

/* --- 组词练习 --- */
var quizSession = null;
var quizMode = 'daily';     // daily = 今日练习 | wrong = 错题专项
var wrongQuizChars = [];    // 进入错题专项时锁定的字表，答题过程中错题本变化不会打断本轮
var currentView = 'learn';

function normPy(s){
  s = String(s || '').toLowerCase().trim();
  try{ s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }catch(e){}
  return s.replace(/[^a-z]/g, '');
}
function matchChar(q, c){
  if(!q) return true;
  var z = ZI[c];
  if(!z) return false;
  if(c === q) return true;
  if(z.r === q) return true;
  var nq = normPy(q);
  if(nq && normPy(z.p) === nq) return true;
  if(nq.length > 1 && nq !== normPy(z.p) && normPy(z.p).indexOf(nq) === 0) return true;
  if(z.w.join('').indexOf(q) >= 0) return true;
  return false;
}

function makeQ1(z){
  var words = z.w.filter(function(w){ return w.indexOf(z.c) >= 0; });
  if(!words.length) return null;
  var answer = words[Math.floor(Math.random()*words.length)];
  var others = [];
  var pool = shuffle(ALLCHARS);
  for(var i=0;i<pool.length && others.length<3;i++){
    if(pool[i] === z.c) continue;
    var o = ZI[pool[i]];
    if(!o) continue;
    var cand = o.w.filter(function(w){ return w.indexOf(z.c) < 0 && w !== answer && others.indexOf(w) < 0; });
    if(cand.length){ others.push(cand[Math.floor(Math.random()*cand.length)]); }
  }
  var opts = shuffle([answer].concat(others));
  return {
    type:'选出含有这个字的词语', char:z.c,
    stem:'下面哪个词语里面有 <span class="bigzi">' + z.c + '</span> 字？',
    opts:opts, answer:opts.indexOf(answer),
    tip:'「' + z.c + '」的组词有：' + z.w.join('、') + '。' + z.e
  };
}

function makeQ2(z){
  var words = z.w.filter(function(w){ return w.indexOf(z.c) >= 0 && w.length >= 2; });
  if(!words.length) return null;
  var word = words[Math.floor(Math.random()*words.length)];
  var idx = word.indexOf(z.c);
  var masked = word.slice(0, idx) + '<span class="blank">?</span>' + word.slice(idx+1);
  var cands = shuffle(ALLCHARS).filter(function(c){
    if(c === z.c) return false;
    var test = word.slice(0, idx) + c + word.slice(idx+1);
    return !WORDSET[test] && ZI[c];
  }).slice(0,3);
  var opts = shuffle([z.c].concat(cands));
  return {
    type:'选字填空', char:z.c,
    stem:'「' + masked + '」这个位置该填哪个字？',
    opts:opts, answer:opts.indexOf(z.c),
    tip:'正确答案是「' + word + '」。' + z.e
  };
}

function newQuiz(chars){
  var qs = [], n = 0;
  for(var i=0;i<chars.length;i++){
    var z = ZI[chars[i]];
    if(!z) continue;
    var q = (n % 2 === 0) ? makeQ1(z) : makeQ2(z);
    if(!q) q = makeQ1(z) || makeQ2(z);
    if(q){ qs.push(q); n++; }
  }
  return { key:chars.join(','), qs:qs, idx:0, right:0, answered:false, picked:-1, done:false };
}

function ensureQuiz(){
  // 错题专项：字表在进入时锁定，答题过程中错题本被扣减也不会重排本轮
  if(quizMode === 'wrong' && !wrongQuizChars.length){ quizMode = 'daily'; }
  var chars;
  if(quizMode === 'wrong'){
    chars = wrongQuizChars.slice();
  }else{
    var plan = ensureTodayPlan();
    var wrongs = wrongArr().slice(0,3).map(function(w){ return w.c; });
    chars = plan.slice();
    for(var i=0;i<wrongs.length;i++){ if(chars.indexOf(wrongs[i]) < 0) chars.push(wrongs[i]); }
  }
  // key 里带上模式，切换模式时强制重开一组
  var key = quizMode + '|' + chars.join(',');
  if(!quizSession || quizSession.key !== key || !quizSession.qs.length){
    quizSession = newQuiz(chars);
    quizSession.key = key;
  }
}

// 进入错题专项重练（错题本 → 练习页）
function startWrongQuiz(){
  var list = wrongArr();
  if(!list.length){ toast('错题本是空的，先去练习几组吧'); return; }
  // 错得最多的优先，最多 12 个，避免一轮太长
  var ranked = list.slice().sort(function(a,b){ return b.count - a.count || b.ts - a.ts; });
  var chars = ranked.slice(0, 12).map(function(w){ return w.c; });
  quizMode = 'wrong';
  wrongQuizChars = chars;
  quizSession = null;
  switchView('practice');
  toast('已生成 ' + chars.length + ' 个字的错题专项练习');
}

function exitWrongQuiz(silent){

function renderQuiz(){
  var wrap = el('quizWrap');
  if(!wrap) return;
  ensureQuiz();
  var s = quizSession;
  var modeBar = quizMode === 'wrong'
    ? '<div class="quiz-mode">' +
        '<span class="qm-tag">错题专项</span>' +
        '<span class="qm-txt">本轮只练错题本里的字，答对会抵扣错误次数，全对完错题自动消失</span>' +
        '<button class="qm-exit" data-quiz-mode="daily">回到每日练习</button>' +
      '</div>'
    : '';
  if(!s.qs.length){
    wrap.innerHTML = modeBar + emptyHTML('暂时没有可练习的字', '先到「今日学字」学几个字，再回来练习');
    return;
  }
  if(s.done){
    var rate = Math.round(s.right / s.qs.length * 100);
    var words = rate >= 80 ? '稳了，这些字你记得很牢' : (rate >= 60 ? '还不错，错的字已经收进错题本' : '别急，错的字多看看象形来历就好记了');
    wrap.innerHTML = modeBar +
      '<div class="empty" style="padding:32px 20px">' +
        '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>' +
        '<div style="font-size:19px;color:var(--ink);font-weight:600;margin-bottom:6px">本轮完成</div>' +
        '<div style="font-size:14px;color:var(--ink2)">答对 <b style="color:var(--green)">' + s.right + '</b> / ' + s.qs.length + ' 题 · 正确率 ' + rate + '%</div>' +
        '<div style="margin-top:8px;font-size:12.5px">' + words + '</div>' +
      '</div>' +
      '<div class="qfoot"><button class="btn btn-primary" data-retry="1">再来一组</button>' +
      '<button class="btn" data-go="level">去看积分</button></div>';
    return;
  }
  var q = s.qs[s.idx];
  var optsHtml = q.opts.map(function(o, i){
    var cls = 'opt';
    if(s.answered){
      cls += ' locked';
      if(i === q.answer) cls += ' right';
      else if(i === s.picked) cls += ' wrong';
    }
    var mark = '';
    if(s.answered && i === q.answer) mark = '<span class="opt-mark" style="color:var(--green)">正确</span>';
    else if(s.answered && i === s.picked) mark = '<span class="opt-mark" style="color:var(--red)">你选的</span>';
    return '<button class="' + cls + '" data-opt="' + i + '">' +
      '<span class="k">' + 'ABCD'[i] + '</span><span>' + o + '</span>' + mark +
    '</button>';
  }).join('');

  var fb = '';
  if(s.answered){
    var ok = s.picked === q.answer;
    fb = '<div class="qfeedback show ' + (ok ? 'ok' : 'no') + '">' +
      '<b>' + (ok ? '答对了 +5 分' : '答错了，已收进错题本') + '</b><br>' + q.tip + '</div>';
  }

  wrap.innerHTML = modeBar +
    '<div class="qhead">' +
      '<span class="qtype">' + q.type + '</span>' +
      '<span class="qstep">第 ' + (s.idx+1) + ' / ' + s.qs.length + ' 题 · 已答对 ' + s.right + '</span>' +
    '</div>' +
    '<div class="qstem">' + q.stem + '</div>' +
    '<div class="opts">' + optsHtml + '</div>' +
    fb +
    '<div class="qfoot">' +
      (s.answered
        ? '<button class="btn btn-primary" data-next="1">' + (s.idx === s.qs.length-1 ? '看本轮结果' : '下一题') + '</button>'
        : '<button class="btn" data-go="learn">先去学字</button><button class="btn btn-ghost" data-skip="1">跳过这题</button>') +
    '</div>';
}

/* ============================================================
   五、业务动作（改数据 → saveState → refreshAll）
   ============================================================ */
function finishToday(){
  var plan = ensureTodayPlan(), n = 0;
  for(var i=0;i<plan.length;i++){
    if(markLearned(plan[i])) n++;
  }
  if(n > 0){
    state.points += n * 10;
    if(todayDoneCount(plan) >= plan.length) state.points += 20;
    saveState();
    refreshAll();
    toast('已学 ' + n + ' 个字，+' + (n*10) + ' 分' + (todayDoneCount(plan) >= plan.length ? '，全部完成再 +20' : ''));
  }else{
    toast('今天这几个字都已经掌握啦');
  }
}

function markOne(c){
  if(markLearned(c)){
    state.points += 10;
    saveState();
    refreshAll();
    toast('「' + c + '」已掌握 +10 分');
  }else{
    refreshAll();
  }
}

function answerQuiz(i){
  var s = quizSession;
  if(!s || s.answered || s.done) return;
  var q = s.qs[s.idx];
  s.answered = true;
  s.picked = i;
  var ok = (i === q.answer);
  if(!state.charStat[q.char]) state.charStat[q.char] = { right:0, wrong:0 };
  if(ok){
    s.right++;
    state.points += 5;
    state.charStat[q.char].right++;
    // 答对 3 次以内的字，从错题本里减轻
    if(state.wrong[q.char]){
      state.wrong[q.char].count--;
      if(state.wrong[q.char].count <= 0) delete state.wrong[q.char];
    }
  }else{
    state.charStat[q.char].wrong++;
    if(!state.wrong[q.char]) state.wrong[q.char] = { count:0, ts:0, type:q.type };
    state.wrong[q.char].count++;
    state.wrong[q.char].ts = Date.now();
    state.wrong[q.char].type = q.type;
  }
  saveState();
  refreshAll();
}

function nextQuiz(){
  var s = quizSession;
  if(!s) return;
  if(s.idx < s.qs.length - 1){
    s.idx++;
    s.answered = false;
    s.picked = -1;
  }else{
    s.done = true;
    saveState();
  }
  refreshAll();
}

function skipQuiz(){
  var s = quizSession;
  if(!s || s.done) return;
  if(s.idx < s.qs.length - 1){ s.idx++; s.answered = false; s.picked = -1; }
  else { s.done = true; }
  refreshAll();
}

function retryQuiz(){
  if(quizMode === 'wrong'){
    var list = wrongArr().slice().sort(function(a,b){ return b.count - a.count || b.ts - a.ts; });
    if(!list.length){
      exitWrongQuiz(true);
      toast('错题已经全部掌握，回到每日练习');
      return;
    }
    wrongQuizChars = list.slice(0, 12).map(function(w){ return w.c; });
  }
  quizSession = null;
  refreshAll();
}

function passLevel(no){
  var st = levelStat(no);
  if(!st.learnFull){ toast('还没学完这一关的字'); return; }
  if(st.passed){ toast('这关已经通关了'); return; }
  if(st.rate < 80){ toast('正确率还差一点（需要 ≥80%，去组词练习巩固）'); return; }
  state.levelPass[no] = { at: todayStr(), rate: st.rate };
  state.points += 50;
  saveState();
  refreshAll();
  toast('第' + no + '关通关！+50 分，当前 ' + state.points + ' 分');
}

function claimReward(id){
  var r = null;
  for(var i=0;i<state.rewards.length;i++){ if(state.rewards[i].id === id) r = state.rewards[i]; }
  if(!r || r.claimed) return;
  if(state.points < r.cost){ toast('积分还不够'); return; }
  state.points -= r.cost;
  state.spent += r.cost;
  r.claimed = new Date().toISOString();
  saveState();
  refreshAll();
  toast('已兑换：' + r.name + '，记得找家长兑现哦');
}

function addReward(){
  openModal(
    '<h3>加一个奖励</h3>' +
    '<div class="m-sub">想好一个想要的奖励，定个积分价格</div>' +
    '<div class="field"><label>奖励名称</label><input id="rwName" placeholder="例如：周末去公园野餐" maxlength="20"></div>' +
    '<div class="field"><label>需要多少积分</label><input id="rwCost" type="number" value="200" min="10" max="9999" inputmode="numeric"></div>' +
    '<div class="m-foot"><button class="btn" data-act="close">取消</button><button class="btn btn-primary" data-act="save-reward">加上去</button></div>'
  );
  setTimeout(function(){ var n = el('rwName'); if(n) n.focus(); }, 120);
}

function saveReward(){
  var name = (el('rwName').value || '').trim();
  var cost = parseInt(el('rwCost').value, 10);
  if(!name){ toast('奖励名称不能为空'); return; }
  if(!cost || cost < 10){ toast('积分至少 10 分'); return; }
  state.rewards.push({ id:'r' + Date.now(), name:name, cost:cost, claimed:0 });
  saveState();
  closeModal();
  refreshAll();
  toast('奖励已加上');
}

function removeWrong(c){

  saveState();

}

function doExport(){
  try{
    var data = JSON.stringify(state, null, 2);
    var blob = new Blob([data], { type:'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '学字台备份-' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    state.backupTip = true;
    saveState();
    refreshAll();
    toast('备份文件已导出');
  }catch(e){ toast('导出失败，请换个浏览器试试'); }
}

function doImportFile(file){
  var r = new FileReader();
  r.onload = function(){
    var d = null;
    try{ d = JSON.parse(r.result); }catch(e){ d = null; }
    if(!d || typeof d !== 'object' || !d.learned){
      toast('导入失败：这不是本工作台的备份文件');
      return;
    }
    var addLearn = 0, addWrong = 0;
    // learned 并集
    for(var c in d.learned){
      if(!d.learned.hasOwnProperty(c)) continue;
      if(!state.learned[c]){ state.learned[c] = d.learned[c]; addLearn++; }
    }
    // learnLog 并集
    for(var day in (d.learnLog || {})){
      if(!d.learnLog.hasOwnProperty(day)) continue;
      var src = d.learnLog[day] || [];
      if(!state.learnLog[day]) state.learnLog[day] = [];
      for(var i=0;i<src.length;i++){
        if(state.learnLog[day].indexOf(src[i]) < 0) state.learnLog[day].push(src[i]);
      }
    }
    // wrong 取次数多的
    for(var w in (d.wrong || {})){
      if(!d.wrong.hasOwnProperty(w)) continue;
      if(!state.wrong[w] || (d.wrong[w].count || 0) > (state.wrong[w].count || 0)){
        state.wrong[w] = d.wrong[w];
        addWrong++;
      }
    }
    // charStat 相加
    for(var ch in (d.charStat || {})){
      if(!d.charStat.hasOwnProperty(ch)) continue;
      if(!state.charStat[ch]) state.charStat[ch] = { right:0, wrong:0 };
      state.charStat[ch].right += d.charStat[ch].right || 0;
      state.charStat[ch].wrong += d.charStat[ch].wrong || 0;
    }
    if(typeof d.points === 'number' && d.points > state.points) state.points = d.points;
    for(var ln in (d.levelPass || {})){
      if(d.levelPass.hasOwnProperty(ln) && !state.levelPass[ln]) state.levelPass[ln] = d.levelPass[ln];
    }
    saveState();
    refreshAll();
    closeModal();
    toast('导入完成：新增 ' + addLearn + ' 个已学字、' + addWrong + ' 条错题');
  };
  r.onerror = function(){ toast('文件读取出错'); };
  r.readAsText(file);
}

function clearDemo(){
  // 只清掉示例里的那 4 个字与 1 条示例错题（若用户之后没再动过）
  var demoChars = ['日','月','山','水'];
  var y = offsetDate(-1);
  for(var i=0;i<demoChars.length;i++){
    var c = demoChars[i];
    if(state.learned[c] && state.learned[c].at === y){ delete state.learned[c]; }
    if(state.learnLog[y]) state.learnLog[y] = state.learnLog[y].filter(function(x){ return x !== c; });
  }
  if(state.wrong['水'] && state.wrong['水'].count === 2) delete state.wrong['水'];
  if(state.charStat['水'] && state.charStat['水'].right === 1) delete state.charStat['水'];
  if(state.demo){ state.points = 0; state.demo = false; }
  if(state.learnLog[y] && !state.learnLog[y].length) delete state.learnLog[y];
  saveState();
  refreshAll();
  closeModal();
  toast('示例数据已清空，可以从第一个字开始学了');
}

   六、视图切换与事件绑定（唯一交互入口）
   ============================================================ */
var VIEW_META = {
  learn:   { t:'今日学字', s:'每天 5 个字，点卡片看象形来历' },
  practice:{ t:'组词练习', s:'用今天的字做几道题，答错自动进错题本' },
  level:   { t:'闯关积分', s:'6 关 90 字，学满 + 正确率 80% 即可通关' },
  wrong:   { t:'错题知识', s:'易错字复习 + 全部字库检索' }
};

function switchView(v){
  currentView = v;
  var views = ['learn','practice','level','wrong'];
  for(var i=0;i<views.length;i++){
    var node = el('view-' + views[i]);
    if(node) node.className = 'view' + (views[i] === v ? ' on' : '');
  }
  var navs = document.querySelectorAll('.nav-btn[data-view]');
  for(var j=0;j<navs.length;j++){
    navs[j].className = 'nav-btn' + (navs[j].getAttribute('data-view') === v ? ' on' : '');
  }
  var tabs = document.querySelectorAll('.tabbar button[data-view]');
  for(var k=0;k<tabs.length;k++){
    tabs[k].className = (tabs[k].getAttribute('data-view') === v ? 'on' : '');
  }
  if(VIEW_META[v]){
    el('pageTitle').textContent = VIEW_META[v].t;
    el('pageSub').textContent = VIEW_META[v].s;
  }
  if(v === 'practice') refillQuizIfNeeded();
  refreshAll();
  try{ window.scrollTo(0, 0); }catch(err){}
}

function refillQuizIfNeeded(){
  if(!quizSession || quizSession.done){ quizSession = null; }
}

function bindEvents(){
  // 侧边栏 / tabbar 切换 + 文本按钮
  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-view]');
    if(t){ switchView(t.getAttribute('data-view')); }
  });

  // 卡片翻面
  var deck = el('cardDeck');
  deck.addEventListener('click', function(e){
    var mk = e.target.closest('[data-mark]');
    if(mk){ e.stopPropagation(); markOne(mk.getAttribute('data-mark')); return; }
    var card = e.target.closest('.zi-card');
    if(card){
      var c = card.getAttribute('data-zi');
      flipped[c] = !flipped[c];
      card.classList.toggle('flip');
    }
  });

  // 今天要处理的按钮 + 关卡通关 + 奖励兑换 + 知识库
  document.addEventListener('click', function(e){
    var go = e.target.closest('[data-go]');
    if(go){
      var gv = go.getAttribute('data-go');
      if(gv === '__export'){ doExport(); } else { switchView(gv); }
      return;
    }

    var pl = e.target.closest('[data-passlv]');
    if(pl){ passLevel(parseInt(pl.getAttribute('data-passlv'), 10)); return; }

    var cl = e.target.closest('[data-claim]');
    if(cl){ claimReward(cl.getAttribute('data-claim')); return; }

    var kb = e.target.closest('[data-kb]');
    if(kb){ openKB(kb.getAttribute('data-kb')); return; }

    var rm = e.target.closest('[data-remove-wrong]');
    if(rm){ removeWrong(rm.getAttribute('data-remove-wrong')); return; }

    // 错题专项重练：进入 / 退出
    if(e.target.closest('[data-wrong-quiz]')){ startWrongQuiz(); return; }
    if(e.target.closest('[data-quiz-mode]')){ exitWrongQuiz(false); return; }

    var mk = e.target.closest('.modal [data-mark]');
    if(mk){ markOne(mk.getAttribute('data-mark')); closeModal(); return; }

    var opt = e.target.closest('[data-opt]');
    if(opt){ answerQuiz(parseInt(opt.getAttribute('data-opt'), 10)); return; }

    if(e.target.closest('[data-next]')){ nextQuiz(); return; }
    if(e.target.closest('[data-skip]')){ skipQuiz(); return; }
    if(e.target.closest('[data-retry]')){ retryQuiz(); return; }

    var tab = e.target.closest('#kbSeg button');
    if(tab){ kbTab = tab.getAttribute('data-tab'); renderKB(); return; }

    var act = e.target.closest('[data-act]');
    if(act){
      var a = act.getAttribute('data-act');
      if(a === 'close'){ closeModal(); }
      else if(a === 'export'){ doExport(); }
      else if(a === 'import'){ el('fileInput').click(); }
      else if(a === 'clear-demo'){ clearDemo(); }
      else if(a === 'reset'){ resetAll(); }
      else if(a === 'reset-confirm'){
        localStorage.removeItem(LS_KEY);
        state = loadState();
        ensureTodayPlan();
        saveState();
        closeModal();
        refreshAll();
        toast('已清空全部数据');
      }
      else if(a === 'save-reward'){ saveReward(); }
      return;
    }
  });

  // 顶栏按钮
  el('btnExport').addEventListener('click', doExport);
  el('btnImport').addEventListener('click', function(){ el('fileInput').click(); });
  el('btnMore').addEventListener('click', openMore);
  el('btnFinishToday').addEventListener('click', finishToday);
  el('btnAddReward').addEventListener('click', addReward);
  el('fileInput').addEventListener('change', function(){
    if(this.files && this.files[0]){ doImportFile(this.files[0]); }
    this.value = '';
  });

  // 搜索
  el('kbSearch').addEventListener('input', function(){ renderKB(); });

  // 遮罩关闭
  el('mask').addEventListener('click', function(e){
    if(e.target === el('mask')) closeModal();
  });

  // 键盘：1-4 选项，Enter 下一题
  document.addEventListener('keydown', function(e){
    if(el('mask').classList.contains('show')) return;
    if(currentView !== 'practice') return;
    var k = e.key;
    if(k >= '1' && k <= '4'){
      var idx = parseInt(k, 10) - 1;
      if(quizSession && !quizSession.answered && quizSession.qs[quizSession.idx] && idx < quizSession.qs[quizSession.idx].opts.length){
        answerQuiz(idx);
      }
    }
    if(k === 'Enter' && quizSession && quizSession.answered){ nextQuiz(); }
  });
}

/* ============================================================
   七、初始化
   ============================================================ */
function init(){
  state = loadState();
  ensureTodayPlan();
  saveState();
  bindEvents();
  refreshAll();
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
}else{
  init();
}
</script>
</body>
</html>
