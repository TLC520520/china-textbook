name: 问题反馈
description: 报告一个 bug，比如字卡翻不开、积分没加、手机上排版错乱
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。这个项目是纯静态单文件，多数问题跟浏览器环境有关，麻烦把下面几项填完整，方便定位。

  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 描述你实际看到的现象
      placeholder: 例如：点「我记住了」之后，积分没有加 10
    validations:
      required: true

  - type: textarea
    id: expect
    attributes:
      label: 你期望的结果
      placeholder: 例如：应该加 10 分，进度条也应该往前走一格
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开「今日学字」
        2. 点开「日」这张卡片翻面
        3. 点「我记住了」
        4. 积分没有变化
    validations:
      required: true

  - type: dropdown
    id: env
    attributes:
      label: 使用方式
      description: 不同方式的排查方向不一样
      options:
        - 在线使用（GitHub Pages）
        - 本地双击 index.html
        - 手机浏览器添加到主屏幕
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: 浏览器与版本
      placeholder: 例如 Chrome 130 / Safari iOS 18 / Edge 129 / 微信内置浏览器
    validations:
      required: true

  - type: textarea
    id: data
    attributes:
      label: 相关数据（可选）
      description: 如果是学习记录、积分、错题异常，可以贴「导出备份」里的相关内容，注意先删掉不想公开的部分
      render: json

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我搜过现有 Issue，没有找到重复的问题
          required: true
        - label: 我试过刷新页面或换个浏览器，问题仍然存在
          required: false
